inherit_gem:
  rubocop-shopify: rubocop.yml

require: rubocop-performance

AllCops:
  Exclude:
    - 'vendor/bundle/**/*'
    - 'local-test/**/*'
    - 'tmp/**/*'
    - 'docs/**/*'
    - 'test/fixtures/liquid_spec/**/*.rb'
    - 'performance/theme/**/*'

Style/GlobalVars:
  Exclude:
    - 'ext/liquid_c/extconf.rb'
