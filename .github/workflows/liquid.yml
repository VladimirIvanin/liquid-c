name: Liquid
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full compatibility corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake test:compatibility:corpus test:compatibility:slice_coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: full-corpus
          path: |
            tmp/compatibility/corpus-full
            tmp/coverage/ruby-utils

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { ruby: '3.2', allowed-failure: false }
          - { ruby: '3.3', allowed-failure: false }
          - { ruby: '3.4', allowed-failure: false }
          - { ruby: ruby-head, allowed-failure: true }
          - { ruby: truffleruby-head, allowed-failure: true }
    name: test (${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake
        continue-on-error: ${{ matrix.allowed-failure }}
        env:
          LIQUID_C_PEDANTIC: 'true'
        if: matrix.ruby != 'truffleruby-head'

      - run: bundle exec rake test:unit
        continue-on-error: ${{ matrix.allowed-failure }}
        env:
          LIQUID_C_PEDANTIC: 'true'
          TEST_OPTS: '-v -s0'
        if: matrix.ruby == 'truffleruby-head'

      - run: bundle exec rubocop
        if: matrix.ruby != 'truffleruby-head'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compatibility-${{ matrix.ruby }}
          path: tmp/compatibility

  check:
    name: Full check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.11.4'
          install_args: hk jactionlint betterleaks osv-scanner
          add_shims_to_path: false
      - name: Use the Ruby installed by setup-ruby
        run: mise link ruby@3.3.0 "$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("prefix")')"
      - name: Install compiler and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential valgrind
      - run: bundle exec rake test:compatibility:sanitizers
      - run: mise run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compatibility-check
          path: tmp/compatibility
