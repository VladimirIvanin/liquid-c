name: Liquid
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full compatibility corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake test:compatibility:corpus test:compatibility:slice_coverage

  packaged-gem:
    name: Packaged gem (Ruby ${{ matrix.ruby }})
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '4.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: |
          gem build liquid5-c.gemspec --output liquid5-c.gem
          bash script/check-package ./liquid5-c.gem

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      BUNDLE_VERSION: ${{ (matrix.ruby == '4.0' || contains(matrix.ruby, 'head')) && 'system' || 'lockfile' }}
    continue-on-error: ${{ matrix.allowed-failure }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { ruby: '3.2', allowed-failure: false }
          - { ruby: '3.3', allowed-failure: false }
          - { ruby: '3.4', allowed-failure: false }
          - { ruby: '4.0', allowed-failure: false }
          - { ruby: ruby-head, allowed-failure: true }
          - { ruby: truffleruby-head, allowed-failure: true }
    name: test (${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ (matrix.ruby == '4.0' || contains(matrix.ruby, 'head')) && 'latest' || 'Gemfile.lock' }}
          bundler-cache: true

      - run: bundle exec rake
        env:
          LIQUID_C_PEDANTIC: 'true'
        if: matrix.ruby != 'truffleruby-head'

      - run: bundle exec rake test:unit
        env:
          LIQUID_C_PEDANTIC: 'true'
          TEST_OPTS: '-v -s0'
        if: matrix.ruby == 'truffleruby-head'

      - run: bundle exec rake test:gem_interop
        env:
          LIQUID_C_CHECKED: 'true'
        if: matrix.ruby != 'truffleruby-head'

      - run: bundle exec rubocop
        if: matrix.ruby != 'truffleruby-head'

  check:
    name: Full check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.11.4'
          install_args: hk jactionlint betterleaks osv-scanner
          add_shims_to_path: false
      - name: Use the Ruby installed by setup-ruby
        run: mise link ruby@3.3.13 "$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("prefix")')"
      - name: Install compiler and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential valgrind
      - name: Select matching Ruby sources for ASan
        id: sanitizer-source
        run: ruby -e 'puts "revision=#{RUBY_REVISION}"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ruby/ruby
          ref: ${{ steps.sanitizer-source.outputs.revision }}
          path: tmp/sanitizer-ruby-source
          persist-credentials: false
      - name: Build Ruby with libc stack unwinding for ASan
        working-directory: tmp/sanitizer-ruby-source
        run: |
          ./autogen.sh
          shared=$(ruby -rrbconfig -e 'print RbConfig::CONFIG.fetch("ENABLE_SHARED")')
          ./configure --prefix="$RUNNER_TEMP/sanitizer-ruby" --enable-shared="$shared" --with-setjmp-type=_setjmp --disable-yjit --disable-install-doc
          make -j"$(nproc)"
          make install
      - name: Run sanitizer checks with the locked bundle
        run: |
          bundle_executable=$(command -v bundle)
          gem_dir=$(ruby -e 'puts Gem.dir')
          gem_path=$(ruby -e 'puts Gem.path.join(File::PATH_SEPARATOR)')
          runtime="$RUNNER_TEMP/sanitizer-ruby"
          export PATH="$runtime/bin:$PATH" GEM_HOME="$gem_dir" GEM_PATH="$gem_path"
          export LD_LIBRARY_PATH="$runtime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$runtime/bin/ruby" "$bundle_executable" exec "$runtime/bin/ruby" test/compatibility/native_safety.rb sanitizers
      - run: mise run check
